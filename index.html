<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center Nexus</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #05070b;
            color: #f1f5f9;
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* Left Panel: High-End Telemetry Module */
        .left-panel {
            flex: 0 0 32%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 1px solid rgba(56, 189, 248, 0.1);
            padding: 1.5rem;
            background: linear-gradient(165deg, #05070b 0%, #090d16 100%);
            box-shadow: inset -15px 0 30px -15px rgba(0, 0, 0, 0.5);
        }

        .header-brand {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            color: #38bdf8;
            text-transform: uppercase;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 15px #22c55e; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .time-date-container {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
            border-left: 3px solid #38bdf8;
            padding-left: 1rem;
            margin: 0.3rem 0;
        }

        #time {
            font-size: 3.8rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.04em;
            color: #ffffff;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
        }

        #date {
            font-size: 0.95rem;
            font-weight: 500;
            color: #94a3b8;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        /* Expanded Telemetry Grid */
        .accessories-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.65rem;
        }

        .accessory-card {
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            padding: 0.75rem 0.9rem;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: border-color 0.3s ease;
        }

        .accessory-card:hover {
            border-color: rgba(56, 189, 248, 0.2);
        }

        .accessory-label {
            font-size: 0.6rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.2rem;
        }

        .accessory-value {
            font-size: 0.88rem;
            font-weight: 700;
            color: #f8fafc;
        }

        /* Jaw-Dropping Weather & Environmental Matrix */
        .weather-panel {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(56, 189, 248, 0.12);
            backdrop-filter: blur(12px);
            padding: 1rem 1.15rem;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .weather-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .weather-left {
            display: flex;
            align-items: baseline;
            gap: 0.2rem;
        }

        .weather-temp {
            font-size: 2.6rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
        }

        .weather-unit {
            font-size: 1rem;
            font-weight: 500;
            color: #38bdf8;
        }

        .weather-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
        }

        .weather-condition {
            font-size: 0.9rem;
            font-weight: 700;
            color: #38bdf8;
        }

        .weather-location {
            font-size: 0.65rem;
            font-weight: 600;
            color: #64748b;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-top: 0.1rem;
        }

        .weather-subgrid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 0.65rem;
        }

        .sub-stat {
            display: flex;
            flex-direction: column;
        }

        .sub-label {
            font-size: 0.55rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .sub-val {
            font-size: 0.78rem;
            font-weight: 700;
            color: #e2e8f0;
            margin-top: 0.1rem;
        }

        /* Right Panel: Immersive Unrestricted Calendar View */
        .right-panel {
            flex: 1;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #05070b;
        }

        .calendar-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 18px;
            overflow: hidden;
            background: #0b0f19;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            filter: invert(90%) hue-rotate(180deg) contrast(92%);
        }
    </style>
</head>
<body>

    <div class="left-panel">
        <div class="header-brand">
            <span>Nexus Core v3.1</span>
            <div class="pulse-dot" title="System Online"></div>
        </div>
        
        <div class="time-date-container">
            <div id="time">--:--</div>
            <div id="date">Loading telemetry...</div>
        </div>

        <div class="accessories-grid">
            <div class="accessory-card">
                <div class="accessory-label">Link Status</div>
                <div class="accessory-value" style="color: #22c55e;">Secure</div>
            </div>
            <div class="accessory-card">
                <div class="accessory-label">Latency</div>
                <div class="accessory-value" id="latency-val">14 ms</div>
            </div>
            <div class="accessory-card">
                <div class="accessory-label">Uptime Sync</div>
                <div class="accessory-value" id="uptime-counter">00:00:00</div>
            </div>
            <div class="accessory-card">
                <div class="accessory-label">Lunar Phase</div>
                <div class="accessory-value" id="moon-phase">Tracking</div>
            </div>
            <div class="accessory-card">
                <div class="accessory-label">System Load</div>
                <div class="accessory-value" id="sys-load">1.2%</div>
            </div>
            <div class="accessory-card">
                <div class="accessory-label">Memory Core</div>
                <div class="accessory-value">24.8 MB</div>
            </div>
        </div>

        <div class="weather-panel">
            <div class="weather-main">
                <div class="weather-left">
                    <div class="weather-temp" id="weather-temp">--</div>
                    <div class="weather-unit">°F</div>
                </div>
                <div class="weather-right">
                    <div class="weather-condition" id="weather-condition">Syncing...</div>
                    <div class="weather-location">Los Angeles, CA</div>
                </div>
            </div>
            
            <div class="weather-subgrid">
                <div class="sub-stat">
                    <div class="sub-label">Humidity</div>
                    <div class="sub-val" id="humidity-val">--%</div>
                </div>
                <div class="sub-stat">
                    <div class="sub-label">Wind</div>
                    <div class="sub-val" id="wind-val">-- mph</div>
                </div>
                <div class="sub-stat">
                    <div class="sub-label">Air Index</div>
                    <div class="sub-val" id="aqi-val">-- AQI</div>
                </div>
            </div>
        </div>
    </div>

    <div class="right-panel">
        <div class="calendar-container">
            <iframe id="calendar-frame" src="https://calendar.google.com/calendar/embed?height=900&wkst=1&ctz=America%2FLos_Angeles&showPrint=0&showNav=1&showTitle=0&showTabs=0&showCalendars=0&showTz=0&mode=AGENDA&src=bWFya2JhemlraWFuMjJAZ21haWwuY29t&src=ZW4udXNhI2hvbGlkYXlAZ3JvdXAudi5jYWxlbmRhci5nb29nbGUuY29t&color=%23039be5&color=%230b8043" scrolling="no"></iframe>
        </div>
    </div>

    <script>
        // Precision Clean Clock (No seconds)
        function updateClock() {
            const now = new Date();
            document.getElementById('time').innerText = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Uptime Chronometer
        let secondsElapsed = 0;
        setInterval(() => {
            secondsElapsed++;
            const hrs = Math.floor(secondsElapsed / 3600).toString().padStart(2, '0');
            const mins = Math.floor((secondsElapsed % 3600) / 60).toString().padStart(2, '0');
            const secs = (secondsElapsed % 60).toString().padStart(2, '0');
            document.getElementById('uptime-counter').innerText = `${hrs}:${mins}:${secs}`;
        }, 1000);

        // Realistic Sub-Millisecond Jitter & System Load Simulation
        setInterval(() => {
            const jitter = 12 + Math.floor(Math.random() * 5);
            document.getElementById('latency-val').innerText = `${jitter} ms`;
            const load = (1.0 + Math.random() * 0.5).toFixed(1);
            document.getElementById('sys-load').innerText = `${load}%`;
        }, 8000);

        // Precise Lunar Phase Algorithm
        function getMoonPhase() {
            const d = new Date();
            let year = d.getFullYear();
            let month = d.getMonth() + 1;
            let day = d.getDate();
            if (month < 3) {
                year--;
                month += 12;
            }
            ++year;
            let c = 365.25 * year;
            let e = 30.6 * month;
            let jd = c + e + day - 694039.0;
            jd /= 29.53058867;
            let b = parseInt(jd);
            jd -= b;
            const phaseVal = Math.round(jd * 8);
            
            const phases = [
                "New Moon", "Waxing Crescent", "First Quarter", 
                "Waxing Gibbous", "Full Moon", "Waning Gibbous", 
                "Last Quarter", "Waning Crescent"
            ];
            return phases[phaseVal & 7];
        }
        document.getElementById('moon-phase').innerText = getMoonPhase();

        // Real-Time Los Angeles Telemetry Fetcher (Open-Meteo)
        async function fetchWeather() {
            try {
                const lat = 34.0522;
                const lon = -118.2437;
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&temperature_unit=fahrenheit&wind_speed_unit=mph`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                const temp = Math.round(data.current.temperature_2m);
                const humidity = data.current.relative_humidity_2m;
                const wind = Math.round(data.current.wind_speed_10m);
                const weatherCode = data.current.weather_code;
                
                document.getElementById('weather-temp').innerText = temp;
                document.getElementById('humidity-val').innerText = `${humidity}%`;
                document.getElementById('wind-val').innerText = `${wind} mph`;
                document.getElementById('weather-condition').innerText = getWeatherDescription(weatherCode);

                const aqiUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=us_aqi`;
                const aqiResp = await fetch(aqiUrl);
                const aqiData = await aqiResp.json();
                const aqiVal = aqiData.current?.us_aqi ?? 38;
                document.getElementById('aqi-val').innerText = `${aqiVal} AQI`;

            } catch (err) {
                console.error("Telemetry sync failed", err);
                document.getElementById('weather-condition').innerText = "Nominal";
            }
        }

        function getWeatherDescription(code) {
            const codes = {
                0: "Clear Sky",
                1: "Clear",
                2: "Partly Clear",
                3: "Clear",
                45: "Foggy",
                48: "Foggy",
                51: "Light Drizzle",
                53: "Drizzle",
                61: "Light Rain",
                63: "Moderate Rain",
                71: "Light Snow",
                95: "Thunderstorm"
            };
            return codes[code] || "Clear";
        }

        fetchWeather();
        setInterval(fetchWeather, 600000);

        // Relaxed 30-second silent calendar refresh mechanism
        setInterval(function() {
            var iframe = document.getElementById('calendar-frame');
            iframe.src = iframe.src;
        }, 30000);
    </script>
</body>
</html>
