<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #0a0c10;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 1px solid #1e293b;
            padding: 2rem;
        }

        #time {
            font-size: 12vw;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.05em;
            color: #f8fafc;
        }

        #date {
            font-size: 2.5vw;
            font-weight: 300;
            color: #94a3b8;
            margin-top: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .right-panel {
            flex: 1;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: hidden;
        }

        .agenda-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #38bdf8;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        #agenda-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .event-card {
            background-color: #161b22;
            padding: 1.5rem;
            border-radius: 12px;
            border-left: 5px solid #38bdf8;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .event-details {
            display: flex;
            flex-direction: column;
        }

        .event-summary {
            font-size: 1.25rem;
            font-weight: 600;
            color: #f1f5f9;
        }

        .event-time {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 0.5rem;
        }

        .event-status {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .status-upcoming {
            background-color: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
        }

        .status-now {
            background-color: rgba(34, 197, 94, 0.1);
            color: #22c55e;
        }
    </style>
</head>
<body>

    <div class="left-panel">
        <div id="time">--:--</div>
        <div id="date">Loading...</div>
    </div>

    <div class="right-panel">
        <div class="agenda-title">Upcoming</div>
        <div id="agenda-list">
            <div class="event-card" style="border-left-color: #38bdf8;">
                <div class="event-details">
                    <div class="event-summary">Command Center Online</div>
                    <div class="event-time">System fully operational</div>
                </div>
                <div class="event-status status-upcoming">Ready</div>
            </div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('time').innerText = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
