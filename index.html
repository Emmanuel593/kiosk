<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Command Center</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 20px;
            padding: 25px;
            overflow: hidden;
        }

        /* Left Side: Command Panel & Telemetry */
        .left-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(12px);
        }

        .top-telemetry {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .time-display {
            font-size: 4.5rem;
            font-weight: 300;
            letter-spacing: -2px;
            color: #ffffff;
        }

        .telemetry-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 10px;
        }

        .telemetry-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 14px;
            border-radius: 12px;
        }

        .telemetry-card .label {
            font-size: 0.8rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .telemetry-card .value {
            font-size: 1.25rem;
            font-weight: 500;
            margin-top: 4px;
            color: #f3f4f6;
        }

        /* Left Action Bar & Light Control Button */
        .action-bar {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-btn {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #60a5fa;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .control-btn:hover {
            background: rgba(59, 130, 246, 0.25);
        }

        /* Slide-out Lighting Panel Modal (Nested in Left Panel) */
        .light-panel {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 18px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }

        .hidden {
            display: none;
        }

        .light-panel h3 {
            font-size: 1rem;
            font-weight: 500;
            color: #e5e7eb;
        }

        .panel-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #60a5fa;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; }

        .action-sub-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .action-sub-btn:hover { background: rgba(255,255,255,0.15); }

        /* Right Side: Google Calendar Container */
        .right-panel {
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(12px);
        }

        .calendar-frame {
            width: 100%;
            height: 100%;
            border: none;
            /* Applies dark styling filter to embedded calendar if needed */
            filter: invert(90%) hue-rotate(180deg);
        }
    </style>
</head>
<body>

    <!-- LEFT SIDE: Clock, Telemetry & Lighting Control Button -->
    <div class="left-panel">
        <div class="top-telemetry">
            <div class="time-display" id="clock">12:00</div>
            
            <div class="telemetry-grid">
                <div class="telemetry-card">
                    <div class="label">Weather</div>
                    <div class="value" id="weatherWidget">72°F · Clear</div>
                </div>
                <div class="telemetry-card">
                    <div class="label">Humidity</div>
                    <div class="value" id="humidityWidget">45%</div>
                </div>
                <div class="telemetry-card">
                    <div class="label">Date / Season</div>
                    <div class="value" id="dateSeasonWidget">Summer · Jul 26</div>
                </div>
                <div class="telemetry-card">
                    <div class="label">Status</div>
                    <div class="value" style="color: #34d399;">Online</div>
                </div>
            </div>
        </div>

        <!-- Action Section: Lighting Controls -->
        <div class="action-bar">
            <button class="control-btn" onclick="toggleLightPanel()">
                <span>💡 Lighting Control</span>
                <span style="font-size: 0.8rem; color: #9ca3af;">Expand ▾</span>
            </button>

            <!-- Slide-down Lighting Panel Modal -->
            <div id="lightControlPanel" class="light-panel hidden">
                <h3>LEDEEZ Bulbs</h3>
                <button class="action-sub-btn" onclick="connectBulbs()" style="width: 100%;">Pair Bluetooth Bulbs</button>
                
                <div style="display: flex; flex-direction: column; gap: 4px;">
                    <label style="font-size: 0.8rem; color: #9ca3af;">Brightness</label>
                    <input type="range" min="0" max="100" value="100" oninput="adjustBrightness(this.value)">
                </div>

                <div class="panel-row">
                    <button class="action-sub-btn" style="flex: 1;" onclick="setPureWhite()">Pure White</button>
                    <input type="color" value="#ff0000" onchange="changeColor(this.value)">
                </div>
            </div>
        </div>
    </div>

    <!-- RIGHT SIDE: Google Calendar Split View -->
    <div class="right-panel">
        <!-- Embed your clean calendar view or private iFrame feed here -->
        <iframe class="calendar-frame" src="https://calendar.google.com/calendar/embed?src=en.usa%23holiday%40group.v.calendar.google.com&ctz=America%2FLos_Angeles"></iframe>
    </div>

    <script>
        // --- Live Clock Script ---
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            hours = hours % 12 || 12;
            document.getElementById('clock').innerText = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- Lighting Panel Toggle ---
        function toggleLightPanel() {
            const panel = document.getElementById('lightControlPanel');
            panel.classList.toggle('hidden');
        }

        // --- Bluetooth Light Control Logic ---
        let connectedBulbs = [];

        async function connectBulbs() {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: ['0000ffe0-0000-1000-8000-00805f9b34fb'] }],
                    optionalServices: ['0000ffe5-0000-1000-8000-00805f9b34fb']
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
                const characteristic = await service.getCharacteristic('0000ffe9-0000-1000-8000-00805f9b34fb');

                connectedBulbs.push({ name: device.name, characteristic });
                alert("Linked: " + device.name);
            } catch (err) {
                console.log("Connection error/canceled:", err);
            }
        }

        async function sendBytes(dataArray) {
            for (let bulb of connectedBulbs) {
                try {
                    await bulb.characteristic.writeValue(new Uint8Array(dataArray));
                } catch (e) {
                    console.log("Command write failed", e);
                }
            }
        }

        async function changeColor(hexVal) {
            let r = parseInt(hexVal.slice(1, 3), 16);
            let g = parseInt(hexVal.slice(3, 5), 16);
            let b = parseInt(hexVal.slice(5, 7), 16);
            await sendBytes([0x56, r, g, b, 0x00, 0xF0, 0xAA]);
        }

        async function setPureWhite() {
            await sendBytes([0x56, 0xFF, 0xFF, 0xFF, 0x00, 0xF0, 0xAA]);
        }

        async function adjustBrightness(val) {
            let brightByte = Math.round((val / 100) * 255);
            await sendBytes([0x56, brightByte, brightByte, brightByte, 0x00, 0x0F, 0xAA]);
        }
    </script>
</body>
</html>
