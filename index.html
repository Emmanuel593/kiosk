<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #07090e;
            color: #f1f5f9;
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* Left Panel: Executive Display */
        .left-panel {
            flex: 0 0 42%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            padding: 3.5rem;
            background: linear-gradient(180deg, #07090e 0%, #0c1017 100%);
        }

        .header-brand {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            color: #38bdf8;
            text-transform: uppercase;
        }

        .time-date-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        #time {
            font-size: 6.5rem;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.03em;
            color: #ffffff;
        }

        #date {
            font-size: 1.35rem;
            font-weight: 400;
            color: #94a3b8;
            letter-spacing: 0.02em;
        }

        /* Professional Weather Module */
        .weather-panel {
            background: rgba(22, 27, 34, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .weather-left {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
        }

        .weather-temp {
            font-size: 3.8rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1;
        }

        .weather-unit {
            font-size: 1.5rem;
            font-weight: 400;
            color: #64748b;
        }

        .weather-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
        }

        .weather-condition {
            font-size: 1.25rem;
            font-weight: 600;
            color: #38bdf8;
        }

        .weather-location {
            font-size: 0.9rem;
            font-weight: 500;
            color: #64748b;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-top: 0.25rem;
        }

        /* Right Panel: Expanded Calendar View */
        .right-panel {
            flex: 1;
            padding: 2.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #07090e;
        }

        .calendar-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            overflow: hidden;
            background: #111622;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            filter: invert(90%) hue-rotate(180deg) contrast(90%);
        }
    </style>
</head>
<body>

    <div class="left-panel">
        <div class="header-brand">Command Center v2.4</div>
        
        <div class="time-date-container">
            <div id="time">--:--</div>
            <div id="date">Loading schedule...</div>
        </div>

        <div class="weather-panel">
            <div class="weather-left">
                <div class="weather-temp" id="weather-temp">--</div>
                <div class="weather-unit">°F</div>
            </div>
            <div class="weather-right">
                <div class="weather-condition" id="weather-condition">Connecting...</div>
                <div class="weather-location">Los Angeles, CA</div>
            </div>
        </div>
    </div>

    <div class="right-panel">
        <div class="calendar-container">
            <iframe id="calendar-frame" src="https://calendar.google.com/calendar/embed?height=800&wkst=1&ctz=America%2FLos_Angeles&showPrint=0&showNav=0&showTitle=0&showTabs=0&showCalendars=0&showTz=0&src=bWFya2JhemlraWFuMjJAZ21haWwuY29t&src=ZW4udXNhI2hvbGlkYXlAZ3JvdXAudi5jYWxlbmRhci5nb29nbGUuY29t&color=%23039be5&color=%230b8043" scrolling="no"></iframe>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('time').innerText = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function fetchWeather() {
            try {
                const lat = 34.0522;
                const lon = -118.2437;
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                const temp = Math.round(data.current.temperature_2m);
                const weatherCode = data.current.weather_code;
                
                document.getElementById('weather-temp').innerText = temp;
                document.getElementById('weather-condition').innerText = getWeatherDescription(weatherCode);
            } catch (err) {
                console.error("Could not load weather", err);
                document.getElementById('weather-condition').innerText = "Normal";
            }
        }

        function getWeatherDescription(code) {
            const codes = {
                0: "Clear Sky",
                1: "Clear",
                2: "Partly Clear",
                3: "Clear",
                45: "Foggy",
                48: "Foggy",
                51: "Light Drizzle",
                53: "Drizzle",
                61: "Light Rain",
                63: "Moderate Rain",
                71: "Light Snow",
                95: "Thunderstorm"
            };
            return codes[code] || "Clear";
        }

        fetchWeather();
        setInterval(fetchWeather, 600000);

        setInterval(function() {
            var iframe = document.getElementById('calendar-frame');
            iframe.src = iframe.src;
        }, 30000);
    </script>
</body>
</html>
