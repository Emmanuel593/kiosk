<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Command Center</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0d0d;
            color: #f0f0f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            overflow: hidden;
        }

        /* Top Header Area */
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .time-display {
            font-size: 5rem;
            font-weight: 300;
            letter-spacing: -2px;
        }

        .weather-season-container {
            text-align: right;
            font-size: 1.2rem;
            color: #a0a0a0;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .weather-main {
            font-size: 1.8rem;
            font-weight: 500;
            color: #fff;
        }

        /* Bottom Action Bar */
        .action-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 14px 24px;
            border-radius: 14px;
            font-size: 1rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: background 0.2s;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Slide-out Lighting Panel Modal */
        .light-panel {
            position: fixed;
            bottom: 90px;
            right: 30px;
            background: rgba(20, 20, 20, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 20px;
            border-radius: 16px;
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            transition: opacity 0.2s, transform 0.2s;
        }

        .hidden {
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
        }

        .light-panel h3 {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .panel-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .panel-row label {
            font-size: 0.9rem;
            color: #ccc;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #fff;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; }

        .action-sub-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            width: 100%;
        }

        .action-sub-btn:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <!-- Header Section: Time & Weather/Season -->
    <div class="header-container">
        <div class="time-display" id="clock">12:00</div>
        <div class="weather-season-container">
            <div class="weather-main" id="weatherWidget">72°F · Clear</div>
            <div id="dateSeasonWidget">Summer · July 26</div>
        </div>
    </div>

    <!-- Bottom Action Bar with Toggle Button -->
    <div class="action-bar">
        <button class="control-btn" onclick="toggleLightPanel()">💡 Lighting Control</button>
    </div>

    <!-- Lighting Control Modal Panel -->
    <div id="lightControlPanel" class="light-panel hidden">
        <h3>LEDEEZ Bulbs</h3>
        <button class="action-sub-btn" onclick="connectBulbs()">Pair Bluetooth Bulbs</button>
        
        <div class="panel-row" style="flex-direction: column; align-items: stretch;">
            <label>Brightness</label>
            <input type="range" min="0" max="100" value="100" oninput="adjustBrightness(this.value)">
        </div>

        <div class="panel-row">
            <button class="action-sub-btn" style="flex: 1;" onclick="setPureWhite()">Pure White</button>
            <input type="color" value="#ff0000" onchange="changeColor(this.value)">
        </div>
    </div>

    <script>
        // --- Live Clock & Date Script ---
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            hours = hours % 12 || 12; // 12-hour format
            document.getElementById('clock').innerText = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- UI Panel Toggle ---
        function toggleLightPanel() {
            const panel = document.getElementById('lightControlPanel');
            panel.classList.toggle('hidden');
        }

        // --- Bluetooth Light Control Script ---
        let connectedBulbs = [];

        async function connectBulbs() {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: ['0000ffe0-0000-1000-8000-00805f9b34fb'] }],
                    optionalServices: ['0000ffe5-0000-1000-8000-00805f9b34fb']
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
                const characteristic = await service.getCharacteristic('0000ffe9-0000-1000-8000-00805f9b34fb');

                connectedBulbs.push({ name: device.name, characteristic });
                alert("Linked: " + device.name);
            } catch (err) {
                console.log("Connection error/canceled:", err);
            }
        }

        async function sendBytes(dataArray) {
            for (let bulb of connectedBulbs) {
                try {
                    await bulb.characteristic.writeValue(new Uint8Array(dataArray));
                } catch (e) {
                    console.log("Command write failed", e);
                }
            }
        }

        async function changeColor(hexVal) {
            let r = parseInt(hexVal.slice(1, 3), 16);
            let g = parseInt(hexVal.slice(3, 5), 16);
            let b = parseInt(hexVal.slice(5, 7), 16);
            await sendBytes([0x56, r, g, b, 0x00, 0xF0, 0xAA]);
        }

        async function setPureWhite() {
            await sendBytes([0x56, 0xFF, 0xFF, 0xFF, 0x00, 0xF0, 0xAA]);
        }

        async function adjustBrightness(val) {
            let brightByte = Math.round((val / 100) * 255);
            await sendBytes([0x56, brightByte, brightByte, brightByte, 0x00, 0x0F, 0xAA]);
        }
    </script>
</body>
</html>
