<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center</title>
    <style>
        /* --- CSS Styles (The Look) --- */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #0a0c10; /* Deep dark background */
            color: #e2e8f0; /* Off-white text */
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* Left Panel: Time & Date */
        .left-panel {
            flex: 1; /* Takes up half the screen */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 1px solid #1e293b;
            padding: 2rem;
        }

        #time {
            font-size: 12vw; /* Huge responsive font size */
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.05em;
            color: #f8fafc;
        }

        #date {
            font-size: 2.5vw;
            font-weight: 300;
            color: #94a3b8; /* Muted gray */
            margin-top: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Right Panel: Agenda (The Cards) */
        .right-panel {
            flex: 1; /* Takes up the other half */
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: hidden;
        }

        .agenda-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #38bdf8; /* Cyan accent color */
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        #agenda-list {
            display: flex;
            flex-direction: column;
            gap: 1rem; /* Space between cards */
        }

        .event-card {
            background-color: #161b22; /* Slightly lighter than background */
            padding: 1.5rem;
            border-radius: 12px;
            border-left: 5px solid #38bdf8; /* Color stripe on the left */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .event-details {
            display: flex;
            flex-direction: column;
        }

        .event-summary {
            font-size: 1.25rem;
            font-weight: 600;
            color: #f1f5f9;
        }

        .event-time {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 0.5rem;
        }

        .event-status {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .status-upcoming {
            background-color: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
        }

        .status-now {
            background-color: rgba(34, 197, 94, 0.1); /* Green for NOW */
            color: #22c55e;
        }

        /* Loading state */
        #loading {
            color: #64748b;
            font-style: italic;
            text-align: center;
        }

    </style>
</head>
<body>

    <!-- Left Panel: Clock -->
    <div class="left-panel">
        <div id="time">--:--</div>
        <div id="date">Loading...</div>
    </div>

    <!-- Right Panel: Agenda -->
    <div class="right-panel">
        <div class="agenda-title">Upcoming</div>
        <div id="agenda-list">
            <div id="loading">Connecting to Command Line...</div>
        </div>
    </div>

    <!-- --- JavaScript (The Brains) --- -->
    <script>
        // !!! IMPORTANT: PASTE YOUR PUBLIC ICAL URL BELOW !!!
        // Go to Google Calendar Settings -> Integrate Calendar -> "Public address in ICAL format"
        const ICAL_URL = "PASTE_YOUR_PUBLIC_ICAL_URL_HERE"; 

        // Function to update clock every second
        function updateClock() {
            const now = new Date();
            document.getElementById('time').innerText = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Function to fetch and parse iCal data (using a CORS proxy because Google doesn't allow direct browser access)
        async function fetchAgenda() {
            const agendaList = document.getElementById('agenda-list');
            
            if (ICAL_URL.includes("YOUR_PUBLIC_ICAL_URL_HERE")) {
                agendaList.innerHTML = '<div class="event-card" style="border-left-color: #ef4444;"><div class="event-summary">CONFIGURATION ERROR</div><div class="event-time">You need to paste your Public iCal URL into the code.</div></div>';
                return;
            }

            try {
                // Use a CORS proxy to bypass browser security restrictions
                const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(ICAL_URL);
                const response = await fetch(proxyUrl);
                const data = await response.json();
                const icalData = data.contents;

                // Parse the iCal text data
                const events = parseICal(icalData);

                // Clear loading message
                agendaList.innerHTML = '';

                if (events.length === 0) {
                    agendaList.innerHTML = '<div class="event-card"><div class="event-summary">Clear skies ahead.</div><div class="event-time">No upcoming events found.</div></div>';
                    return;
                }

                // Render the next 5 events
                events.slice(0, 5).forEach(event => {
                    const card = document.createElement('div');
                    card.className = 'event-card';
                    
                    // Check if event is happening now
                    const now = new Date();
                    const isNow = now >= event.start && now <= event.end;
                    if (isNow) card.style.borderLeftColor = '#22c55e';

                    const timeText = event.allDay 
                        ? 'All Day' 
                        : `${event.start.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })} - ${event.end.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}`;

                    card.innerHTML = `
                        <div class="event-details">
                            <div class="event-summary">${event.summary}</div>
                            <div class="event-time">${timeText}</div>
                        </div>
                        <div class="event-status ${isNow ? 'status-now' : 'status-upcoming'}">
                            ${isNow ? 'Now' : event.start.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}
                        </div>
                    `;
                    agendaList.appendChild(card);
                });

            } catch (error) {
                console.error('Error fetching calendar:', error);
                agendaList.innerHTML = '<div class="event-card" style="border-left-color: #ef4444;"><div class="event-summary">Connection Failed</div><div class="event-time">Could not retrieve calendar data. Check your URL or try again later.</div></div>';
            }
        }

        // iCal Parser Function (Simplified)
        function parseICal(data) {
            const events = [];
            const lines = data.split('\n');
            let currentEvent = null;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line === 'BEGIN:VEVENT') {
                    currentEvent = {};
                } else if (line === 'END:VEVENT') {
                    if (currentEvent && currentEvent.start) {
                        // Sort only future events
                        if (currentEvent.end > new Date()) {
                           events.push(currentEvent);
                        }
                    }
                    currentEvent = null;
                } else if (currentEvent) {
                    if (line.startsWith('SUMMARY:')) {
                        currentEvent.summary = line.substring(8);
                    } else if (line.startsWith('DTSTART')) {
                        currentEvent.start = parseDate(line);
                        if (line.includes('VALUE=DATE')) currentEvent.allDay = true;
                    } else if (line.startsWith('DTEND')) {
                        currentEvent.end = parseDate(line);
                    }
                }
            }
            return events.sort((a, b) => a.start - b.start);
        }

        // Helper to parse iCal date strings
        function parseDate(line) {
            const dateStr = line.split(':')[1];
            if (!dateStr) return null;
            if (dateStr.length === 8) {
                // YYYYMMDD
                return new Date(dateStr.substring(0, 4), dateStr.substring(4, 6) - 1, dateStr.substring(6, 8));
            } else {
                // YYYYMMDDTHHMMSSZ (UTC)
                return new Date(dateStr.substring(0, 4), dateStr.substring(4, 6) - 1, dateStr.substring(6, 8), dateStr.substring(9, 11), dateStr.substring(11, 13));
            }
        }

        // Fetch immediately, then every 30 seconds
        fetchAgenda();
        setInterval(fetchAgenda, 30000); // 30000 ms = 30 seconds

    </script>
</body>
</html>
