<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Command Center</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            height: 100dvh; /* Dynamic viewport height for mobile browsers */
            display: grid;
            grid-template-columns: 1.1fr 1.4fr;
            gap: 20px;
            padding: 20px;
            overflow: hidden;
        }

        /* Left Panel */
        .left-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(12px);
            height: 100%;
        }

        .top-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .time-display {
            font-size: 3.8rem;
            font-weight: 300;
            letter-spacing: -2px;
            color: #ffffff;
        }

        /* Weather Card */
        .weather-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .weather-main {
            font-size: 1.4rem;
            font-weight: 500;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .weather-details {
            font-size: 0.9rem;
            color: #9ca3af;
            display: flex;
            gap: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 8px;
        }

        .telemetry-row {
            display: flex;
            gap: 10px;
        }

        .mini-badge {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            color: #9ca3af;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex: 1;
        }

        .mini-badge span {
            color: #f3f4f6;
            font-weight: 500;
        }

        /* Compact Lighting Control Button & Modal */
        .lighting-container {
            position: relative;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 400;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .light-panel {
            position: absolute;
            bottom: 50px;
            left: 0;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 16px;
            border-radius: 14px;
            width: 260px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            z-index: 100;
        }

        .hidden {
            display: none;
        }

        .light-panel h3 {
            font-size: 0.95rem;
            font-weight: 500;
            color: #e5e7eb;
        }

        .panel-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #60a5fa;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; }

        .action-sub-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            color: #fff;
            padding: 7px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .action-sub-btn:hover { background: rgba(255,255,255,0.15); }

        /* Right Panel: Calendar */
        .right-panel {
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(12px);
            height: 100%;
        }

        .calendar-frame {
            width: 100%;
            height: 100%;
            border: none;
            filter: invert(90%) hue-rotate(180deg);
        }
    </style>
</head>
<body>

    <!-- LEFT SIDE -->
    <div class="left-panel">
        <div class="top-section">
            <div class="time-display" id="clock">12:00</div>
            
            <!-- Weather Card -->
            <div class="weather-card">
                <div class="weather-main">
                    <span>72°F · Clear</span>
                    <span style="font-size: 1rem; color: #9ca3af;">Los Angeles</span>
                </div>
                <div class="weather-details">
                    <span>Humidity: 45%</span>
                    <span>Wind: 4 mph</span>
                </div>
            </div>

            <!-- Status & Date/Season Row -->
            <div class="telemetry-row">
                <div class="mini-badge">
                    <span>Status</span>
                    <span style="color: #34d399;">Online</span>
                </div>
                <div class="mini-badge">
                    <span>Season</span>
                    <span>Summer</span>
                </div>
            </div>
        </div>

        <!-- Compact Lighting Button & Floating Panel -->
        <div class="lighting-container">
            <button class="control-btn" onclick="toggleLightPanel()">
                💡 Lights
            </button>

            <div id="lightControlPanel" class="light-panel hidden">
                <h3>LEDEEZ Bulbs</h3>
                <button class="action-sub-btn" onclick="connectBulbs()" style="width: 100%;">Pair Bluetooth Bulbs</button>
                
                <div style="display: flex; flex-direction: column; gap: 4px;">
                    <label style="font-size: 0.8rem; color: #9ca3af;">Brightness</label>
                    <input type="range" min="0" max="100" value="100" oninput="adjustBrightness(this.value)">
                </div>

                <div class="panel-row">
                    <button class="action-sub-btn" style="flex: 1;" onclick="setPureWhite()">Pure White</button>
                    <input type="color" value="#ff0000" onchange="changeColor(this.value)">
                </div>
            </div>
        </div>
    </div>

    <!-- RIGHT SIDE: Clean Agenda Calendar Feed -->
    <div class="right-panel">
        <iframe class="calendar-frame" src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=America%2FLos_Angeles&showPrint=0&showTitle=0&showNav=0&showTabs=0&showCalendars=0&showTz=0&mode=AGENDA&src=bWFya2JhemlraWFuMjJAZ21haWwuY29t&src=ZW4udXNhI2hvbGlkYXlAZ3JvdXAudi5jYWxlbmRhci5nb29nbGUuY29t&color=%23039be5&color=%230b8043" frameborder="0" scrolling="no"></iframe>
    </div>

    <script>
        // --- Live Clock Script ---
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            hours = hours % 12 || 12;
            document.getElementById('clock').innerText = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- Lighting Panel Toggle ---
        function toggleLightPanel() {
            const panel = document.getElementById('lightControlPanel');
            panel.classList.toggle('hidden');
        }

        // --- Bluetooth Light Control Logic ---
        let connectedBulbs = [];

        async function connectBulbs() {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: ['0000ffe0-0000-1000-8000-00805f9b34fb'] }],
                    optionalServices: ['0000ffe5-0000-1000-8000-00805f9b34fb']
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
                const characteristic = await service.getCharacteristic('0000ffe9-0000-1000-8000-00805f9b34fb');

                connectedBulbs.push({ name: device.name, characteristic });
                alert("Linked: " + device.name);
            } catch (err) {
                console.log("Connection error/canceled:", err);
            }
        }

        async function sendBytes(dataArray) {
            for (let bulb of connectedBulbs) {
                try {
                    await bulb.characteristic.writeValue(new Uint8Array(dataArray));
                } catch (e) {
                    console.log("Command write failed", e);
                }
            }
        }

        async function changeColor(hexVal) {
            let r = parseInt(hexVal.slice(1, 3), 16);
            let g = parseInt(hexVal.slice(3, 5), 16);
            let b = parseInt(hexVal.slice(5, 7), 16);
            await sendBytes([0x56, r, g, b, 0x00, 0xF0, 0xAA]);
        }

        async function setPureWhite() {
            await sendBytes([0x56, 0xFF, 0xFF, 0xFF, 0x00, 0xF0, 0xAA]);
        }

        async function adjustBrightness(val) {
            let brightByte = Math.round((val / 100) * 255);
            await sendBytes([0x56, brightByte, brightByte, brightByte, 0x00, 0x0F, 0xAA]);
        }
    </script>
</body>
</html>
