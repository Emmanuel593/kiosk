<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a; /* Clean dark mode background */
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Makes the embedded calendar fill the screen and blend into dark mode */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #0f172a;
        }
    </style>
</head>
<body>

    <div class="container">
        <iframe id="calendar-frame" src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=America%2FLos_Angeles&showPrint=0&showTz=0&showNav=0&showTabs=0&showCalendars=0&mode=MONTH&showTitle=0&title&src=bWFya2JhemlraWFuMjJAZ21haWwuY29t&src=ZW4udXNhI2hvbGlkYXlAZ3JvdXAudi5jYWxlbmRhci5nb29nbGUuY29t&color=%23039be5&color=%230b8043" scrolling="no"></iframe>
    </div>

    <script>
        // Silently refreshes the calendar iframe every 30 seconds without a jarring white flash
        setInterval(function() {
            var iframe = document.getElementById('calendar-frame');
            iframe.src = iframe.src;
        }, 30000); // 30000 ms = 30 seconds
    </script>

</body>
</html>
